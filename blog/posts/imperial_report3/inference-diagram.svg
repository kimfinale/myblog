<svg xmlns="http://www.w3.org/2000/svg" width="760" height="630" viewBox="0 0 760 630" role="img" aria-labelledby="title description">
  <title id="title">From outbreak size to a reproduction-number estimate</title>
  <desc id="description">Exported cases and travel assumptions inform an outbreak-size estimate. Assumptions about initial cases, transmission timing, and individual variation enter alongside it. Comparing possible histories with outbreak size gives a conditional reproduction-number estimate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#466272"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; text-anchor: middle; fill: #173747; }
      .heading { font-size: 26px; font-weight: 700; }
      .detail { font-size: 23px; }
      .arrow { fill: none; stroke: #466272; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="0" y="0" width="760" height="630" rx="18" fill="#f6f8fa"/>
  <rect x="28" y="30" width="344" height="190" rx="14" fill="#e6f0f7" stroke="#668bab" stroke-width="2"/>
  <text class="heading" x="200" y="76">Outbreak size</text>
  <text class="detail" x="200" y="119">Exported-case evidence</text>
  <text class="detail" x="200" y="155">Travel and detection</text>
  <text class="detail" x="200" y="191">assumptions</text>
  <rect x="388" y="30" width="344" height="190" rx="14" fill="#f8eee7" stroke="#ac7b60" stroke-width="2"/>
  <text class="heading" x="560" y="76">Transmission assumptions</text>
  <text class="detail" x="560" y="119">Initial cases</text>
  <text class="detail" x="560" y="155">Generation time</text>
  <text class="detail" x="560" y="191">Individual variation</text>
  <path class="arrow" d="M 200 220 V 252 L 285 298"/>
  <path class="arrow" d="M 560 220 V 252 L 475 298"/>
  <rect x="108" y="305" width="544" height="130" rx="14" fill="#ffffff" stroke="#668bab" stroke-width="2"/>
  <text class="heading" x="380" y="355">Compare possible histories</text>
  <text class="detail" x="380" y="394">with the estimated outbreak size</text>
  <path class="arrow" d="M 380 435 V 484"/>
  <rect x="108" y="495" width="544" height="105" rx="14" fill="#e8f1eb" stroke="#628c70" stroke-width="2"/>
  <text class="heading" x="380" y="539">Reproduction-number estimate</text>
  <text class="detail" x="380" y="578">Conditional on the chosen inputs</text>
</svg>
